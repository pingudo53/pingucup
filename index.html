<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PINGU CUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-oscuro:#0c2e21;
    --verde-cancha:#123f2c;
    --verde-linea:#1e6b47;
    --dorado:#d7ac3d;
    --dorado-brillo:#f0c85e;
    --crema:#f3ecd8;
    --tinta:#132018;
    --rojo:#c1392b;
    --gris-linea: rgba(243,236,216,0.18);
    --sombra: rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(90deg, var(--verde-cancha) 0px, var(--verde-cancha) 60px, var(--verde-linea) 60px, var(--verde-linea) 120px);
    font-family:'Barlow Condensed', sans-serif;
    color:var(--tinta);
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }

  #app{
    width:100%;
    max-width:620px;
  }

  /* ---------- SCOREBOARD HEADER ---------- */
  .scoreboard{
    background:var(--verde-oscuro);
    border:3px solid var(--dorado);
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:18px;
    box-shadow:0 8px 24px var(--sombra);
    display:none;
  }
  .scoreboard.visible{display:block;}
  .scoreboard-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'Anton', sans-serif;
    color:var(--dorado-brillo);
    letter-spacing:1px;
  }
  .scoreboard-top .jornada{font-size:15px; color:var(--crema); opacity:0.75;}
  .scoreboard-top .titulo-mini{font-size:20px;}
  .scoreboard-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-family:'Roboto Mono', monospace;
  }
  .scoreboard-club{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--crema);
    font-size:14px;
  }
  .scoreboard-pts{
    background:#000;
    color:var(--dorado-brillo);
    font-weight:700;
    font-size:20px;
    padding:2px 10px;
    border-radius:4px;
    min-width:34px;
    text-align:center;
    border:1px solid var(--dorado);
  }

  .tabla-posiciones{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-family:'Roboto Mono', monospace;
  }
  .tabla-posiciones th{
    font-family:'Anton', sans-serif;
    font-size:11px;
    letter-spacing:1px;
    color:var(--dorado);
    text-align:center;
    padding:4px 4px 8px;
    opacity:0.8;
  }
  .tabla-posiciones th.col-club{ text-align:left; }
  .tabla-posiciones td{
    text-align:center;
    padding:6px 4px;
    color:var(--crema);
    font-size:15px;
    border-top:1px solid rgba(243,236,216,0.15);
  }
  .tabla-posiciones td.col-club{
    text-align:left;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tabla-posiciones tr.mi-club td{ color:var(--dorado-brillo); font-weight:700; }
  .tabla-posiciones td.pts{
    font-weight:700;
    color:var(--dorado-brillo);
  }

  /* ---------- CRESTS (placeholders) ---------- */
  .crest{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;
    font-size:11px;
    border:1.5px dashed var(--dorado);
    color:var(--dorado-brillo);
    background:rgba(215,172,61,0.08);
    flex-shrink:0;
  }
  .crest.big{width:64px;height:64px;font-size:20px;border-width:2px;}
  .crest img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  /*
    Escudos reales: pingu.jpeg (Pingu FC) y wachin.jpeg (Wachines FC).
    Tienen que estar en la misma carpeta que este archivo HTML.
  */

  /* ---------- CARDS ---------- */
  .card{
    background:var(--crema);
    border-radius:12px;
    padding:22px 20px;
    margin-bottom:16px;
    box-shadow:0 10px 26px var(--sombra);
    position:relative;
    border:1px solid rgba(0,0,0,0.06);
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1.5px dashed rgba(19,32,24,0.15);
    border-radius:8px;
    pointer-events:none;
  }
  .card h1, .card h2, .card h3{
    font-family:'Anton', sans-serif;
    letter-spacing:0.5px;
    margin:0 0 10px;
    color:var(--verde-oscuro);
  }
  .card h1{font-size:30px;}
  .card h2{font-size:22px;}
  .card h3{font-size:17px; color:var(--rojo);}
  .card p{line-height:1.45; margin:6px 0; font-size:17px;}

  .eyebrow{
    font-family:'Anton', sans-serif;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dorado);
    background:var(--verde-oscuro);
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }

  /* ---------- HERO / TITLE SCREEN ---------- */
  .hero{
    text-align:center;
    padding:36px 18px 28px;
  }
  .hero .marca{
    font-family:'Anton', sans-serif;
    font-size:52px;
    color:var(--crema);
    text-shadow:0 4px 0 var(--verde-oscuro), 0 10px 18px var(--sombra);
    letter-spacing:2px;
    line-height:0.95;
  }
  .hero .marca span{color:var(--dorado-brillo);}
  .hero .sub{
    font-family:'Barlow Condensed', sans-serif;
    color:var(--crema);
    font-size:16px;
    opacity:0.85;
    margin-top:6px;
  }

  /* ---------- FORM CONTROLS ---------- */
  label.field-label{
    font-family:'Anton', sans-serif;
    font-size:13px;
    letter-spacing:1px;
    color:var(--verde-oscuro);
    display:block;
    margin:16px 0 8px;
  }
  input[type=text]{
    width:100%;
    padding:12px 14px;
    font-size:18px;
    font-family:'Barlow Condensed', sans-serif;
    border:2px solid var(--verde-oscuro);
    border-radius:8px;
    background:#fff;
    color:var(--tinta);
  }
  input[type=text]:focus{outline:2px solid var(--dorado);}

  select.select-pais{
    width:100%;
    padding:12px 14px;
    font-size:17px;
    font-family:'Barlow Condensed', sans-serif;
    border:2px solid var(--verde-oscuro);
    border-radius:8px;
    background:#fff;
    color:var(--tinta);
  }
  select.select-pais:focus{outline:2px solid var(--dorado);}

  .fila-pais{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .fila-pais select{flex:1;}
  .bandera-img{
    width:36px;
    height:26px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid rgba(19,32,24,0.25);
    flex-shrink:0;
    vertical-align:middle;
  }
  .bandera-img.chica{width:24px; height:18px;}

  .opciones-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:6px;
  }
  .opcion-btn{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:8px;
    border:2px solid var(--verde-oscuro);
    background:#fff;
    cursor:pointer;
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--tinta);
    transition:transform .12s ease, background .12s ease;
    text-align:left;
  }
  .opcion-btn:hover{background:var(--dorado); transform:translateY(-2px);}
  .opcion-btn.selected{background:var(--verde-oscuro); color:var(--crema); border-color:var(--dorado);}
  .opcion-btn .emoji{font-size:20px;}

  .club-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:16px 10px;
  }

  .btn-principal{
    display:block;
    width:100%;
    margin-top:20px;
    padding:14px;
    font-family:'Anton', sans-serif;
    font-size:18px;
    letter-spacing:1px;
    background:var(--verde-oscuro);
    color:var(--dorado-brillo);
    border:2px solid var(--dorado);
    border-radius:8px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .btn-principal:hover{background:#0a2419;}
  .btn-principal:disabled{opacity:0.4; cursor:not-allowed;}

  .btn-secundario{
    display:block;
    width:100%;
    margin-top:10px;
    padding:11px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:16px;
    background:transparent;
    color:var(--verde-oscuro);
    border:2px solid var(--verde-oscuro);
    border-radius:8px;
    cursor:pointer;
  }
  .btn-secundario:hover{background:rgba(19,32,24,0.06);}

  /* ---------- MATCH RESULT ---------- */
  .marcador{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:14px 0;
    font-family:'Roboto Mono', monospace;
  }
  .marcador .equipo{
    text-align:center; font-size:14px; max-width:110px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .marcador .equipo img{
    width:38px; height:38px; border-radius:50%;
    object-fit:cover; border:2px solid var(--dorado);
    background:#fff;
  }
  .marcador .goles{
    font-family:'Anton', sans-serif;
    font-size:38px;
    color:var(--verde-oscuro);
    background:#fff;
    border:2px solid var(--verde-oscuro);
    border-radius:8px;
    padding:2px 14px;
  }
  .stat-linea{
    display:flex;
    justify-content:space-between;
    padding:6px 2px;
    border-bottom:1px dashed var(--gris-linea);
    font-size:16px;
  }
  .stat-linea b{font-family:'Roboto Mono', monospace;}
  .badge-resultado{
    display:inline-block;
    font-family:'Anton', sans-serif;
    font-size:13px;
    letter-spacing:1px;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .badge-gano{background:#1e6b47; color:#fff;}
  .badge-perdio{background:var(--rojo); color:#fff;}
  .badge-empato{background:#8a7a3d; color:#fff;}

  .media-cambio{font-family:'Roboto Mono', monospace; font-weight:700;}
  .sube{color:#1e6b47;}
  .baja{color:var(--rojo);}

  /* ---------- PARTIDO EN VIVO ---------- */
  .punto-vivo{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--rojo);
    margin-left:6px;
    animation:parpadeo 1s infinite;
  }
  @keyframes parpadeo{ 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  .reloj-partido{
    font-family:'Roboto Mono', monospace;
    font-size:15px;
    font-weight:700;
    color:var(--verde-oscuro);
    text-align:center;
    background:rgba(19,32,24,0.06);
    border-radius:20px;
    padding:3px 12px;
    display:inline-block;
    margin-bottom:4px;
  }

  .relato-partido{
    margin-top:16px;
    max-height:220px;
    overflow-y:auto;
    display:flex;
    flex-direction:column-reverse;
  }
  .linea-relato{
    font-size:15px;
    padding:7px 4px;
    border-bottom:1px dashed var(--gris-linea);
    animation:aparecer .25s ease;
  }
  @keyframes aparecer{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- MINIJUEGO DE GOL ---------- */
  .minijuego-overlay{
    position:fixed; inset:0;
    background:rgba(6,20,13,0.78);
    display:flex; align-items:center; justify-content:center;
    z-index:999;
    padding:16px;
    transition:background .3s ease;
  }
  .minijuego-overlay.acierto{ background:rgba(30,107,71,0.85); }
  .minijuego-overlay.fallo{ background:rgba(193,57,43,0.85); }

  .minijuego-card{
    background:var(--crema);
    border-radius:14px;
    padding:22px 20px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 14px 32px rgba(0,0,0,0.5);
  }
  .minijuego-card h3{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--verde-oscuro);
    margin:6px 0 18px;
  }

  .barra-gol{
    position:relative;
    height:26px;
    background:#fff;
    border:2px solid var(--verde-oscuro);
    border-radius:6px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .zona-verde{
    position:absolute;
    top:0; bottom:0;
    background:rgba(30,107,71,0.35);
    border-left:2px solid #1e6b47;
    border-right:2px solid #1e6b47;
  }
  .indicador-gol{
    position:absolute;
    top:-3px; bottom:-3px;
    width:5px;
    background:var(--rojo);
    border-radius:2px;
    transform:translateX(-50%);
    box-shadow:0 0 6px rgba(0,0,0,0.4);
  }

  .timer-barra{
    height:5px;
    background:rgba(19,32,24,0.12);
    border-radius:4px;
    margin-top:14px;
    overflow:hidden;
  }
  .timer-relleno{
    height:100%;
    background:var(--dorado);
    width:100%;
  }

  .direccion-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:4px;
  }
  .direccion-btn{
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:4px;
    padding:16px 6px;
    font-size:15px;
    line-height:1.3;
  }
  .direccion-btn:disabled{ cursor:default; }
  .direccion-btn.selected{
    color:var(--crema);
    border-color:var(--dorado);
  }
  .direccion-btn.selected.acierto{
    background:#1e6b47;
    border-color:#1e6b47;
  }
  .direccion-btn.selected.fallo{
    background:var(--rojo);
    border-color:var(--rojo);
  }

  /* ---------- FINAL SCREEN ---------- */
  .trofeo-placeholder{
    width:150px;height:150px;
    margin:14px auto;
    border-radius:14px;
    border:2px dashed var(--dorado);
    background:rgba(215,172,61,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:'Anton', sans-serif;
    color:var(--dorado);
    font-size:13px;
    letter-spacing:1px;
    padding:10px;
  }
  /*
    Para poner la foto de la copa: reemplazá el div de arriba (id="trofeo-img")
    por, por ejemplo:
    <img src="copa.png" style="width:150px;border-radius:14px;">
  */

  .footer-nota{
    text-align:center;
    color:rgba(243,236,216,0.55);
    font-size:12px;
    margin-top:18px;
  }

  @media (max-width:420px){
    .hero .marca{font-size:38px;}
    .opciones-grid{grid-template-columns:1fr;}
  }
</style>
</head>

  <div class="scoreboard" id="scoreboard">

  <div id="screen-container"></div>

  <div class="footer-nota">Pingu Cup · adaptado para jugar en el navegador</div>
</div>

// Calcula los números del partido (goles totales, cuántos te tocan a vos,
// y tu probabilidad de definir) sin resolver nada todavía. Lo que se
// resuelve en el momento, minuto a minuto, es el minijuego.
function calcularPlanPartido(j){
  const rival = j.club === "Pingu FC" ? "Wachines FC" : "Pingu FC";

  const golesLocal = randInt(0,4);
  const golesVisitante = randInt(0,4);

  let golesMiEquipo, golesRival;
  if(j.club === "Pingu FC"){
    golesMiEquipo = golesLocal;
    golesRival = golesVisitante;
  } else {
    golesMiEquipo = golesVisitante;
    golesRival = golesLocal;
  }

  const golesEquipo = golesMiEquipo;
  let participaciones = 0;
  let probGol = 40;

  if(golesEquipo > 0){
    let maxParticipaciones;
    if(j.media >= 90) maxParticipaciones = golesEquipo;
    else if(j.media >= 85) maxParticipaciones = golesEquipo;
    else if(j.media >= 80) maxParticipaciones = Math.max(1, golesEquipo);
    else if(j.media >= 75) maxParticipaciones = Math.max(1, golesEquipo - 1);
    else if(j.media >= 70) maxParticipaciones = Math.max(1, golesEquipo - 2);
    else maxParticipaciones = Math.max(1, golesEquipo - 3);

    if(j.posicion === "Delantero"){
      // Los delanteros se llevan prácticamente todas las chances de gol
      // del equipo: casi siempre todos los goles (o todos menos uno) son suyos.
      participaciones = Math.max(1, golesEquipo - randInt(0, 1));
    } else if(j.posicion === "Mediocampista"){
      participaciones = randInt(1, Math.min(maxParticipaciones, golesEquipo));
    } else if(j.posicion === "Defensor"){
      participaciones = randInt(1, Math.min(2, maxParticipaciones));
    } else {
      // El arquero no participa de las jugadas ofensivas: sus chances son de atajar pito.
      participaciones = 0;
    }
    participaciones = Math.min(participaciones, golesEquipo);

    // Probabilidad de convertir en el minijuego (= ancho de la zona verde).
    // Bien achicada para que dependa mucho más de la habilidad del jugador
    // que de suerte; el delantero sigue siendo el que más chances reales
    // tiene de acertar, pero la barra es corta para todos.
    probGol = 26;
    if(j.posicion === "Delantero") probGol += 16;
    else if(j.posicion === "Mediocampista") probGol += 6;
    else if(j.posicion === "Defensor") probGol -= 6;
    probGol += (j.media - 65) * 0.6;
    probGol = Math.max(10, Math.min(55, Math.round(probGol)));
  }

  // Si sos arquero, en vez de participar en jugadas ofensivas te tocan
  // chances del rival para atajar. La cantidad de chances es aleatoria
  // (menos que antes) y la probabilidad de atajar (= ancho de la zona
  // verde) depende de tu media.
  let chancesArquero = 0;
  let probAtajar = 45;
  if(j.posicion === "Arquero"){
    chancesArquero = randInt(2, 4);
    probAtajar = 35 + (j.media - 65) * 0.9;
    probAtajar = Math.max(15, Math.min(70, Math.round(probAtajar)));
  }

  return { rival, golesMiEquipo, golesRival, golesEquipo, participaciones, probGol, chancesArquero, probAtajar };
}

// Arma la línea de tiempo: en qué minuto pasa cada gol (rival, de un
// compañero, o una chance tuya que dispara el minijuego).
function construirEventosPartido(plan, jugador){
  const minutosUsados = new Set();
  function minutoLibre(){
    let m;
    do { m = randInt(3, 90); } while(minutosUsados.has(m));
    minutosUsados.add(m);
    return m;
  }

  const eventos = [];

  if(jugador.posicion === "Arquero"){
    // Cada chance del rival se resuelve en vivo con el minijuego de atajada.
    for(let i = 0; i < plan.chancesArquero; i++){
      eventos.push({ minuto: minutoLibre(), tipo: "chance_arquero" });
    }
  } else {
    for(let i = 0; i < plan.golesRival; i++){
      eventos.push({ minuto: minutoLibre(), tipo: "rival_gol" });
    }
  }

  const golesCompaneros = plan.golesEquipo - plan.participaciones;
  for(let i = 0; i < golesCompaneros; i++){
    eventos.push({ minuto: minutoLibre(), tipo: "equipo_gol_companero" });
  }
  for(let i = 0; i < plan.participaciones; i++){
    eventos.push({ minuto: minutoLibre(), tipo: "chance_jugador" });
  }

  eventos.sort((a,b) => a.minuto - b.minuto);
  return eventos;
}

// Cuánto tarda (en ms reales) cada minuto simulado. Más rápido = partido
// más corto de ver; se puede ajustar sin romper nada más.
const VELOCIDAD_MINUTO_MS = 75;

/* =========================================================
   AMISTOSO CON LA SELECCIÓN
   (PAISES ya está ordenado según el ranking FIFA que me pasaron,
   así que el ranking de un país es directamente su posición en ese
   array. Con eso se calcula una "fuerza" por selección y se arma un
   partido lo más lógico posible según la diferencia de nivel.)
   ========================================================= */
function rankingPais(codigo){
  const idx = PAISES.findIndex(p => p[0] === codigo);
  return idx >= 0 ? idx + 1 : 120;
}

function fuerzaPorRanking(rank){
  let f = 97 - (rank - 1) * 0.28;
  return Math.max(38, Math.min(97, f));
}

function elegirRivalSeleccion(){
  const candidatos = PAISES.filter(p => p[0] !== jugador.paisCodigo);
  return candidatos[randInt(0, candidatos.length - 1)];
}

function calcularPlanPartidoSeleccion(j, rivalCodigo, rivalNombre){
  const rankJugador = rankingPais(j.paisCodigo);
  const rankRival = rankingPais(rivalCodigo);
  const fuerzaJugador = fuerzaPorRanking(rankJugador);
  const fuerzaRival = fuerzaPorRanking(rankRival);
  const diff = fuerzaJugador - fuerzaRival;

  // Goles esperados de cada selección según la diferencia de nivel
  // (no es un puntaje fijo: se le suma variación al azar para que el
  // resultado no sea siempre el mismo entre dos selecciones parecidas).
  function simGoles(esperado){
    const variacion = (Math.random() - 0.5) * 2.2;
    return Math.max(0, Math.round(esperado + variacion));
  }

  const esperadoPropio = Math.max(0.25, Math.min(3.4, 1.45 + diff * 0.03));
  const esperadoRival = Math.max(0.25, Math.min(3.4, 1.45 - diff * 0.03));

  const golesMiEquipo = simGoles(esperadoPropio);
  const golesRival = simGoles(esperadoRival);
  const golesEquipo = golesMiEquipo;

  let participaciones = 0;
  let probGol = 40;

  if(golesEquipo > 0){
    let maxParticipaciones;
    if(j.media >= 90) maxParticipaciones = golesEquipo;
    else if(j.media >= 85) maxParticipaciones = golesEquipo;
    else if(j.media >= 80) maxParticipaciones = Math.max(1, golesEquipo);
    else if(j.media >= 75) maxParticipaciones = Math.max(1, golesEquipo - 1);
    else if(j.media >= 70) maxParticipaciones = Math.max(1, golesEquipo - 2);
    else maxParticipaciones = Math.max(1, golesEquipo - 3);

    if(j.posicion === "Delantero"){
      participaciones = Math.max(1, golesEquipo - randInt(0, 1));
    } else if(j.posicion === "Mediocampista"){
      participaciones = randInt(1, Math.min(maxParticipaciones, golesEquipo));
    } else if(j.posicion === "Defensor"){
      participaciones = randInt(1, Math.min(2, maxParticipaciones));
    } else {
      participaciones = 0;
    }
    participaciones = Math.min(participaciones, golesEquipo);

    probGol = 24;
    if(j.posicion === "Delantero") probGol += 16;
    else if(j.posicion === "Mediocampista") probGol += 6;
    else if(j.posicion === "Defensor") probGol -= 6;
    probGol += (j.media - 65) * 0.6;
    // Contra selecciones más fuertes que la tuya cuesta un poco más definir
    probGol -= Math.max(0, fuerzaRival - fuerzaJugador) * 0.25;
    probGol = Math.max(8, Math.min(55, Math.round(probGol)));
  }

  let chancesArquero = 0;
  let probAtajar = 45;
  if(j.posicion === "Arquero"){
    chancesArquero = randInt(2, 4);
    probAtajar = 35 + (j.media - 65) * 0.9;
    probAtajar -= Math.max(0, fuerzaRival - fuerzaJugador) * 0.3;
    probAtajar = Math.max(10, Math.min(70, Math.round(probAtajar)));
  }

  return {
    rival: rivalNombre, rivalCodigo, golesMiEquipo, golesRival, golesEquipo,
    participaciones, probGol, chancesArquero, probAtajar, fuerzaJugador, fuerzaRival
  };
}

function jugarAmistosoSeleccion(){
  const rivalPais = elegirRivalSeleccion();
  const rivalCodigo = rivalPais[0];
  const rivalNombre = rivalPais[1];

  const eventos = construirEventosPartido(plan, jugador);
  renderPartidoSeleccionEnVivo(plan, eventos, rivalCodigo, rivalNombre);
}

      clearInterval(intervalId);

function finalizarPartidoSeleccion(plan, g1, g2, goles, asistencias, atajadas, golesRecibidos, rivalCodigo, rivalNombre){
  const golesMiEquipo = g1;
  const golesRival = jugador.posicion === "Arquero" ? golesRecibidos : g2;

  let nota;

  if(jugador.posicion === "Arquero"){
    nota = 5.5;
    nota += (atajadas || 0) * 0.68;
    nota -= golesRival * 0.5;
    nota += (jugador.media - 60) * 0.02;
    if(golesRival === 0 && atajadas > 0) nota += 0.8;
  } else {
    nota = 5.0 + ((jugador.media - 60) * 0.075);
    nota += goles * 1.1;
    nota += asistencias * 0.8;

    if(golesMiEquipo > golesRival) nota += 0.5;
    else if(golesMiEquipo === golesRival) nota += 0.2;
    else nota -= 0.4;

    if(jugador.posicion === "Defensor"){
      if(golesRival <= 1) nota += 0.5;
    } else if(jugador.posicion === "Mediocampista"){
      nota += asistencias * 0.2;
    } else if(jugador.posicion === "Delantero"){
      nota += goles * 0.3;
    }
  }

  nota += (Math.random() * 0.8 - 0.4);
  nota = Math.round(Math.max(3.0, Math.min(10.0, nota)) * 10) / 10;

  jugador.selPartidos++;
  jugador.selGoles += goles;
  jugador.selAsistencias += asistencias;
  jugador.selAtajadas += (atajadas || 0);

  let esMVP = false;
  if(nota > 8.9){ jugador.media += 1; jugador.selMVP++; esMVP = true; }

  let cambioMedia = 0;
  if(nota >= 7.3){ jugador.media += 2; cambioMedia = 2; }
  else if(nota < 6.3){ jugador.media -= 1; cambioMedia = -1; }

  clampMedia();

  const resultado = {
    rivalNombre, rivalCodigo, miEquipo: golesMiEquipo, rivalGoles: golesRival,
    goles, asistencias, atajadas: (atajadas || 0), nota, cambioMedia, esMVP
  };

  mostrarResultadoFinalSeleccion(resultado);
}

function mostrarResultadoFinalSeleccion(resultado){
  let badge;
  if(resultado.miEquipo > resultado.rivalGoles){
    badge = `<span class="badge-resultado badge-gano">GANÓ TU SELECCIÓN</span>`;
  } else if(resultado.miEquipo < resultado.rivalGoles){
    badge = `<span class="badge-resultado badge-perdio">PERDIÓ TU SELECCIÓN</span>`;
  } else {
    badge = `<span class="badge-resultado badge-empato">EMPATE</span>`;
  }

  const cambioClase = resultado.cambioMedia > 0 ? "sube" : (resultado.cambioMedia < 0 ? "baja" : "");
  const cambioTexto = resultado.cambioMedia > 0 ? `+${resultado.cambioMedia}` : (resultado.cambioMedia < 0 ? `${resultado.cambioMedia}` : "sin cambios");

  const esArquero = jugador.posicion === "Arquero";
  const statsRendimiento = esArquero
    ? `<div class="stat-linea"><span>🧤 Atajadas</span><b>${resultado.atajadas}</b></div>`
    : `
      <div class="stat-linea"><span>⚽ Goles</span><b>${resultado.goles}</b></div>
      <div class="stat-linea"><span>🎯 Asistencias</span><b>${resultado.asistencias}</b></div>
    `;

  screen.innerHTML = `
    <div class="card">
      <span class="eyebrow">Amistoso Internacional · Resultado</span>
      ${badge}
      <div class="marcador">
        <div class="equipo"><img src="${urlBandera(jugador.paisCodigo, 80)}" alt="${jugador.nacionalidad}"><span>${jugador.nacionalidad}</span></div>
        <div class="goles">${resultado.miEquipo} - ${resultado.rivalGoles}</div>
        <div class="equipo"><img src="${urlBandera(resultado.rivalCodigo, 80)}" alt="${resultado.rivalNombre}"><span>${resultado.rivalNombre}</span></div>
      </div>
      <h2>Tu rendimiento</h2>
      ${statsRendimiento}
      <div class="stat-linea"><span>⭐ Nota</span><b>${resultado.nota}</b></div>
      ${resultado.esMVP ? '<h2 style="color:black;">🏅 ¡Fuiste la figura del amistoso! (+1 de media) </h2>' : ''}
      <div class="stat-linea"><span>Media</span><b class="media-cambio ${cambioClase}">${jugador.media} (${cambioTexto})</b></div>

      <button class="btn-principal" id="btn-volver-torneo">Volver al torneo</button>
    </div>
  `;

  document.getElementById("btn-volver-torneo").onclick = jugarPartidoDeLaSemana;
}

            actualizarMarcadorVivo();
            miAsistencias++;
            log(`🎯 <b>${minuto}'</b> No llegaste a definir, pero la asistencia valió gol igual.`);
          } else {
            log(`😮‍💨 <b>${minuto}'</b> No llegaste a definir y ahí se cortó la jugada. Sigue el partido.`);
          }

          intervalId = setInterval(tick, VELOCIDAD_MINUTO_MS);
        });
        return;

      } else if(ev.tipo === "chance_arquero"){
        clearInterval(intervalId);
        log(`⚠️ <b>${minuto}'</b> ¡Chance clara del rival! Tenés que atajarla.`);

        const jugarMinijuegoAtajar = randInt(1,2) === 1 ? mostrarMinijuegoAtajada : mostrarMinijuegoAtajadaDireccion;
        jugarMinijuegoAtajar(plan.probAtajar, (resultado)=>{
          if(resultado === "atajada"){
            atajadas++;
            log(`🧤 <b>${minuto}'</b> ¡ATAJADÓN de ${jugador.nombre.toUpperCase()}! Que la guarde.`);
          } else {
            if(esPingu) g2++; else g1++;
            actualizarMarcadorVivo();
            golesRecibidos++;
            log(`😱 <b>${minuto}'</b> Gol del rival. No llegaste a la pelota.`);
          }

          intervalId = setInterval(tick, VELOCIDAD_MINUTO_MS);
        });
        return;
      }
    }

    if(minuto >= 90){
      clearInterval(intervalId);
      log(`<b>🏁 ¡Final del partido!</b>`);
      setTimeout(()=> finalizarPartidoEnVivo(plan, g1, g2, miGoles, miAsistencias, atajadas, golesRecibidos), 900);
    }
  }
}

// El minijuego: una barra con un indicador que va y viene, y una zona verde
// cuyo ancho depende de tu probabilidad de éxito (posición + media). Tocás
// el botón cuando el indicador está dentro de la zona para acertar.
// Se usa tanto para las chances de gol (delantero/mediocampista/defensor)
// como para las chances de atajar (arquero); config define los textos y
// qué resultado devuelve el callback en cada caso.
function mostrarMinijuego(config){
  const { probExito, media, eyebrow, subtitulo, textoBoton, idBoton, resultadoExito, resultadoFallo, callback } = config;

  const overlay = document.createElement("div");
  overlay.className = "minijuego-overlay";
  overlay.innerHTML = `
    <div class="minijuego-card">
      <span class="eyebrow">${eyebrow}</span>
      <h3>${subtitulo}</h3>
      <div class="barra-gol">
        <div class="zona-verde" id="zona-verde"></div>
        <div class="indicador-gol" id="indicador-gol"></div>
      </div>
      <button class="btn-principal" id="${idBoton}">${textoBoton}</button>
      <div class="timer-barra"><div class="timer-relleno" id="timer-relleno"></div></div>
    </div>
  `;
  document.body.appendChild(overlay);

  const zonaAncho = probExito; // % del ancho de la barra: a mejor media, zona más ancha
  const zonaIzq = randInt(0, 100 - zonaAncho);
  const zonaEl = document.getElementById("zona-verde");
  zonaEl.style.left = zonaIzq + "%";
  zonaEl.style.width = zonaAncho + "%";

  const indicadorEl = document.getElementById("indicador-gol");
  const timerEl = document.getElementById("timer-relleno");

  const inicio = performance.now();
  const duracionTotal = 3000;
  // La velocidad del indicador también depende de la media: a mejor media,
  // barrido un poco más lento (más fácil de frenar); a peor media, más
  // rápido. Se le suma una leve variación aleatoria para que no sea
  // siempre exactamente igual.
  let periodoBarrido = 1100 - (media - 65) * 5;
  periodoBarrido = Math.max(750, Math.min(1450, periodoBarrido));
  periodoBarrido += randInt(-60, 60);

  let resuelto = false;
  let rafId;

  function frame(ahora){
    const transcurrido = ahora - inicio;

    const fase = (transcurrido % periodoBarrido) / periodoBarrido;
    const pos = fase < 0.5 ? fase * 2 * 100 : (1 - (fase - 0.5) * 2) * 100;
    indicadorEl.style.left = pos + "%";

    const progreso = Math.min(1, transcurrido / duracionTotal);
    timerEl.style.width = (100 - progreso * 100) + "%";

    if(transcurrido >= duracionTotal){
      resolver(false, 0);
      return;
    }

    rafId = requestAnimationFrame(frame);
  }

  function resolver(clickeado, posActual){
    if(resuelto) return;
    resuelto = true;
    cancelAnimationFrame(rafId);

    const acierto = clickeado && posActual >= zonaIzq && posActual <= (zonaIzq + zonaAncho);

    overlay.classList.add(acierto ? "acierto" : "fallo");

    setTimeout(()=>{
      overlay.remove();
      const fallo = typeof resultadoFallo === "function" ? resultadoFallo() : resultadoFallo;
      callback(acierto ? resultadoExito : fallo);
    }, 500);
  }

  document.getElementById(idBoton).onclick = ()=>{
    const posActual = parseFloat(indicadorEl.style.left) || 0;
    resolver(true, posActual);
  };

  rafId = requestAnimationFrame(frame);
}

function mostrarMinijuegoGol(probGol, callback){
  mostrarMinijuego({
    probExito: probGol,
    media: jugador.media,
    eyebrow: "¡Chance de gol!",
    subtitulo: 'Tocá "¡REMATAR!" cuando el indicador esté en la zona verde',
    textoBoton: "¡REMATAR!",
    idBoton: "btn-rematar",
    resultadoExito: "gol",
    resultadoFallo: resolverFalloGol,
    callback
  });
}

// Cuando fallás una chance de gol (en cualquiera de los dos minijuegos),
// no siempre es asistencia: 60% de las veces sí, la pelota termina en
// gol de un compañero; el otro 40% no pasa nada y el partido sigue igual.
function resolverFalloGol(){
  return randInt(1,100) <= 55 ? "asistencia" : "perdida";
}

// Minijuego del arquero: mismo mecanismo pero para atajar. Si tenés menos
// media, la zona verde es más angosta (menos chances de ganar el minijuego)
// y si lo perdés, es gol del rival, claramente.
function mostrarMinijuegoAtajada(probAtajar, callback){
  mostrarMinijuego({
    probExito: probAtajar,
    media: jugador.media,
    eyebrow: "¡Chance del rival!",
    subtitulo: 'Tocá "¡ATAJAR!" cuando el indicador esté en la zona verde',
    textoBoton: "¡ATAJAR!",
    idBoton: "btn-atajar",
    resultadoExito: "atajada",
    resultadoFallo: "gol",
    callback
  });
}

/* ---------- SEGUNDO MINIJUEGO: ELEGIR DIRECCIÓN ---------- */
// Variante del minijuego: en vez de frenar una barra, elegís hacia dónde
// va la pelota (izquierda / al medio / derecha). Es más simple y rápido,
// y se alterna al azar con el minijuego de la barra para darle variedad
// al partido.
function mostrarMinijuegoDireccion(config){
  const { probExito, eyebrow, subtitulo, resultadoExito, resultadoFallo, callback } = config;

  const overlay = document.createElement("div");
  overlay.className = "minijuego-overlay";
  overlay.innerHTML = `
    <div class="minijuego-card">
      <span class="eyebrow">${eyebrow}</span>
      <h3>${subtitulo}</h3>
      <div class="direccion-grid">
        <button class="opcion-btn direccion-btn" data-dir="izquierda">⬅️<br>Izquierda</button>
        <button class="opcion-btn direccion-btn" data-dir="centro">⬆️<br>Al medio</button>
        <button class="opcion-btn direccion-btn" data-dir="derecha">➡️<br>Derecha</button>
      </div>
      <div class="timer-barra"><div class="timer-relleno" id="timer-relleno-direccion"></div></div>
    </div>
  `;
  document.body.appendChild(overlay);

  const timerEl = document.getElementById("timer-relleno-direccion");
  const inicio = performance.now();
  const duracionTotal = 3000; // mismo tiempo que el minijuego de la barra

  let resuelto = false;
  let rafId;

  function frame(ahora){
    const transcurrido = ahora - inicio;
    const progreso = Math.min(1, transcurrido / duracionTotal);
    timerEl.style.width = (100 - progreso * 100) + "%";

    if(transcurrido >= duracionTotal){
      resolver(false); // se te acabó el tiempo: no llegaste a elegir
      return;
    }

    rafId = requestAnimationFrame(frame);
  }

  function resolver(elegiste, btnElegido){
    if(resuelto) return;
    resuelto = true;
    cancelAnimationFrame(rafId);

    overlay.querySelectorAll(".direccion-btn").forEach(b=> b.disabled = true);

    // Si llegaste a elegir, se resuelve con la probabilidad de la jugada;
    // si se acabó el tiempo sin elegir, es fallo directo (te quitan la
    // pelota, o en el caso del arquero, gol del rival).
    const acierto = elegiste && (randInt(1,100) <= probExito);

    if(btnElegido){
      btnElegido.classList.add("selected", acierto ? "acierto" : "fallo");
    }
    overlay.classList.add(acierto ? "acierto" : "fallo");

    setTimeout(()=>{
      overlay.remove();
      const fallo = typeof resultadoFallo === "function" ? resultadoFallo() : resultadoFallo;
      callback(acierto ? resultadoExito : fallo);
    }, 550);
  }

  overlay.querySelectorAll(".direccion-btn").forEach(btn=>{
    btn.onclick = ()=>{
      if(resuelto) return;
      resolver(true, btn);
    };
  });

  rafId = requestAnimationFrame(frame);
}

// A diferencia del minijuego de la barra (que depende de posición y media),
// acá la probabilidad es fija: 60% de meterla si elegís a tiempo.
function mostrarMinijuegoGolDireccion(probGol, callback){
  mostrarMinijuegoDireccion({
    probExito: 60,
    eyebrow: "¡Chance de gol!",
    subtitulo: "Elegí para dónde patear",
    resultadoExito: "gol",
    resultadoFallo: resolverFalloGol,
    callback
  });
}

// Variante de dirección para el arquero: elegís para dónde tirarte.
// Probabilidad fija de 60% de adivinar el lado (si elegís a tiempo).
function mostrarMinijuegoAtajadaDireccion(probAtajar, callback){
  mostrarMinijuegoDireccion({
    probExito: 60,
    eyebrow: "¡Chance del rival!",
    subtitulo: "Elegí para dónde tirarte",
    resultadoExito: "atajada",
    resultadoFallo: "gol",
    callback
  });
}

// Cuando termina el partido en vivo: calcula la nota, actualiza al
// jugador y muestra la pantalla de resultado (igual que antes).
function finalizarPartidoEnVivo(plan, g1, g2, goles, asistencias, atajadas, golesRecibidos){
  const esPingu = jugador.club === "Pingu FC";
  // El marcador real que terminó teniendo el partido (puede ser menor al
  // plan original si alguna chance de gol quedó en "no pasó nada").
  const golesMiEquipo = esPingu ? g1 : g2;
  // Si sos arquero, los goles del rival salen de lo que pasó en los
  // minijuegos de atajada (no del número fijo calculado antes del partido).
  const golesRival = jugador.posicion === "Arquero" ? golesRecibidos : (esPingu ? g2 : g1);

  let nota;

  if(jugador.posicion === "Arquero"){
    // Para el arquero la nota se basa sobre todo en lo que hizo en la
    // cancha (cuánto atajó, cuántos goles le hicieron), no en la media:
    // si atajó todo tiene que reflejarse en la nota aunque tenga media baja.
    // La media sigue influyendo, pero poco.
    nota = 5.5;
    nota += (atajadas || 0) * 0.55;
    nota -= golesRival * 0.5;
    nota += (jugador.media - 60) * 0.02;
    if(golesRival === 0 && atajadas > 0) nota += 0.8;
  } else {
    nota = 5.0 + ((jugador.media - 60) * 0.075);
    nota += goles * 1.1;
    nota += asistencias * 0.8;

    if(golesMiEquipo > golesRival) nota += 0.5;
    else if(golesMiEquipo === golesRival) nota += 0.2;
    else nota -= 0.4;

    if(jugador.posicion === "Defensor"){
      if(golesRival <= 1) nota += 0.8;
    } else if(jugador.posicion === "Mediocampista"){
      nota += asistencias * 0.2;
    } else if(jugador.posicion === "Delantero"){
      nota += goles * 0.3;
    }
  }

  nota += (Math.random() * 0.8 - 0.4);
  nota = Math.round(Math.max(3.0, Math.min(10.0, nota)) * 10) / 10;

  jugador.partidos++;
  jugador.goles += goles;
  jugador.asistencias += asistencias;
  jugador.atajadas += (atajadas || 0);

  if(nota > 8.6){ jugador.media += 1; jugador.mvp++; }

  let cambioMedia = 0;
  if(nota >= 7.2){ jugador.media += 2; cambioMedia = 2; }
  else if(nota < 6.2){ jugador.media -= 1; cambioMedia = -1; }

  clampMedia();
  notaActual = nota;

  const resultado = { rival: plan.rival, miEquipo: golesMiEquipo, rivalGoles: golesRival, goles, asistencias, atajadas: (atajadas || 0), nota, cambioMedia };

  mostrarResultadoFinalPartido(resultado, g1, g2);
}

/* =========================================================
   RENDER HELPERS
   ========================================================= */
function actualizarScoreboard(){
  document.getElementById("sb-jornada").textContent = `SEMANA ${semana}/${TOTAL_SEMANAS}`;

  const crestImg = {"Pingu FC":"pingu.png", "Wachines FC":"wachin.jpeg"};
  const tabla = [
    { club:"Pingu FC", gf:gfPingu, gc:gcPingu, pts:puntosPingu },
    { club:"Wachines FC", gf:gfWachines, gc:gcWachines, pts:puntosWachines }
  ];

  tabla.sort((a,b)=>{
    if(b.pts !== a.pts) return b.pts - a.pts;
    return (b.gf - b.gc) - (a.gf - a.gc);
  });

  const cuerpo = document.getElementById("tabla-posiciones-body");
  cuerpo.innerHTML = tabla.map(fila=>{
    const dif = fila.gf - fila.gc;
    const difTexto = dif > 0 ? `+${dif}` : `${dif}`;
    const esMiClub = jugador && jugador.club === fila.club;
    return `
      <tr class="${esMiClub ? "mi-club" : ""}">
        <td class="col-club"><div class="crest"><img src="${crestImg[fila.club]}" alt="${fila.club}"></div><span>${fila.club}</span></td>
        <td>${fila.gf}</td>
        <td>${fila.gc}</td>
        <td>${difTexto}</td>
        <td class="pts">${fila.pts}</td>
      </tr>
    `;
  }).join("");
}

/* ---------- PANTALLA 0: INICIO ---------- */
function pantallaInicio(){
  scoreboardEl.classList.remove("visible");
  screen.innerHTML = `
    <div class="hero">
      <div class="marca">PINGU<br><span>CUP</span></div>
      <div class="sub">Creá tu jugador y jugá la temporada</div>
    </div>
    <div class="card">
      <span class="eyebrow">Paso 1</span>
      <h2>Nombre del jugador</h2>
      <input type="text" id="input-nombre" placeholder="Ej: Mibul Toso" maxlength="20">

      <label class="field-label">Elegí una nacionalidad</label>
      <div class="fila-pais">
        <img id="preview-bandera" class="bandera-img" style="display:none;">
        <select class="select-pais" id="select-nacionalidad">
          <option value="">-- Elegí un país --</option>
        </select>
      </div>

      <label class="field-label">Elegí una posición</label>
      <div class="opciones-grid" id="grid-posiciones"></div>

      <label class="field-label">Elegí un club</label>
      <div class="opciones-grid" id="grid-clubes"></div>

      <button class="btn-principal" id="btn-crear" disabled>Crear jugador</button>
    </div>
  `;

  const selectNacionalidad = document.getElementById("select-nacionalidad");
  const previewBandera = document.getElementById("preview-bandera");
  PAISES.forEach(([codigo, nombre])=>{
    const opt = document.createElement("option");
    opt.value = codigo;
    opt.textContent = nombre;
    selectNacionalidad.appendChild(opt);
  });

  selectNacionalidad.addEventListener("change", ()=>{
    if(selectNacionalidad.value){
      previewBandera.src = urlBandera(selectNacionalidad.value, 80);
      previewBandera.style.display = "block";
    } else {
      previewBandera.style.display = "none";
    }
  });

  const gridPos = document.getElementById("grid-posiciones");
  let posSel = null, clubSel = null;

  POSICIONES.forEach(p=>{
    const b = document.createElement("button");
    b.className = "opcion-btn";
    b.innerHTML = `<span class="emoji">${POSICION_EMOJI[p]}</span> ${p}`;
    b.onclick = ()=>{
      gridPos.querySelectorAll(".opcion-btn").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
      posSel = p;
      revisar();
    };
    gridPos.appendChild(b);
  });

  const gridClubes = document.getElementById("grid-clubes");
  const crestImgSeleccion = {"Pingu FC":"pingu.png","Wachines FC":"wachin.jpeg"};
  CLUBES.forEach(c=>{
    const b = document.createElement("button");
    b.className = "opcion-btn club-btn";
    b.innerHTML = `<div class="crest big"><img src="${crestImgSeleccion[c]}" alt="${c}"></div><span>${c}</span>`;
    b.onclick = ()=>{
      gridClubes.querySelectorAll(".opcion-btn").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
      clubSel = c;
      revisar();
    };
    gridClubes.appendChild(b);
  });

  const btnCrear = document.getElementById("btn-crear");
  const inputNombre = document.getElementById("input-nombre");
  inputNombre.addEventListener("input", revisar);
  selectNacionalidad.addEventListener("change", revisar);

  function revisar(){
    btnCrear.disabled = !(inputNombre.value.trim().length > 0 && posSel && clubSel && selectNacionalidad.value);
  }

  btnCrear.onclick = ()=>{
    const codigoPais = selectNacionalidad.value;
    const nombrePais = PAISES.find(p => p[0] === codigoPais)[1];
    jugador = crearJugador(inputNombre.value.trim(), posSel, clubSel, nombrePais, codigoPais);
    pantallaFicha();
  };
}

/* ---------- PANTALLA 1: FICHA DEL JUGADOR ---------- */
function pantallaFicha(){
  screen.innerHTML = `
    <div class="card">
      <span class="eyebrow">Tu jugador</span>
      <h1>${jugador.nombre}</h1>
      <div class="stat-linea"><span>Nacionalidad</span><b><img class="bandera-img chica" src="${urlBandera(jugador.paisCodigo)}"> ${jugador.nacionalidad}</b></div>
      <div class="stat-linea"><span>Edad</span><b>${jugador.edad}</b></div>
      <div class="stat-linea"><span>Posición</span><b>${POSICION_EMOJI[jugador.posicion]} ${jugador.posicion}</b></div>
      <div class="stat-linea"><span>Club</span><b>${jugador.club}</b></div>
      <div class="stat-linea"><span>Media</span><b>${jugador.media}</b></div>
      <button class="btn-principal" id="btn-empezar">Comenzar la Pingu Cup</button>
    </div>
  `;
  document.getElementById("btn-empezar").onclick = ()=>{
    semana = 1;
    puntosPingu = 0;
    puntosWachines = 0;
    gfPingu = 0; gcPingu = 0;
    gfWachines = 0; gcWachines = 0;
    scoreboardEl.classList.add("visible");
    actualizarScoreboard();
    iniciarSemana();
  };
}

/* ---------- PANTALLA 2: EVENTO DE LA SEMANA ---------- */
function iniciarSemana(){
  actualizarScoreboard();
  mostrarEvento();
}

function mostrarEvento(){
  // Con más de 90 de media, hay muchas más chances de que te llegue el
  // llamado de la selección esta semana (en vez de depender de que
  // salga al azar entre los 27 eventos).
  let id;
  if(jugador.media >= 86 && randInt(1,100) <= 65){
    id = 28;
  } else {
    id = randInt(1, 27);
  }
  //cambio evento

  // El evento de la hinchada (id 3) solo puede aparecer si la nota del
  // último partido fue menor a 6.5. Si fue 6.5 o más, se saltea.
  if(id === 3 && notaActual >= 6.5){
    continuarSinEvento();
    return;
  }

  const ev = EVENTOS[id];
  const textoEv = typeof ev.texto === "function" ? ev.texto(jugador) : ev.texto;
  const emojiEv = typeof ev.emoji === "function" ? ev.emoji(jugador) : ev.emoji;

  if(ev.auto){
    const resultado = ev.auto(jugador);
    clampMedia();
    renderResultadoEvento(emojiEv, ev.titulo, textoEv, resultado);
    return;
  }

  const opcionesHtml = ev.opciones.map((op, idx)=>
    `<button class="opcion-btn" data-idx="${idx}"><span class="emoji">${op.icono || "▫️"}</span> ${op.label}</button>`
  ).join("");

  screen.innerHTML = `
    <div class="card">
      <span class="eyebrow">Semana ${semana}/${TOTAL_SEMANAS} · Evento</span>
      <h3>${emojiEv} ${ev.titulo}</h3>
      <p>${textoEv}</p>
      <div class="opciones-grid" style="grid-template-columns:1fr;">${opcionesHtml}</div>
    </div>
  `;

  screen.querySelectorAll(".opcion-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.idx, 10);

      // Convocatoria a la selección (id 28), opción "Aceptar" (idx 0):
      // en vez del resultado de texto normal, se interrumpe el torneo y
      // se juega en vivo un amistoso contra una selección rival al azar.
      if(id === 28 && idx === 0){
        jugarAmistosoSeleccion();
        return;
      }

      const resultado = ev.opciones[idx].run(jugador);
      clampMedia();
      renderResultadoEvento(emojiEv, ev.titulo, textoEv, resultado);
    };
  });
}

function renderResultadoEvento(emoji, titulo, textoEv, resultadoTexto){
  screen.innerHTML = `
    <div class="card">
      <span class="eyebrow">Semana ${semana}/${TOTAL_SEMANAS} · Evento</span>
      <h3>${emoji} ${titulo}</h3>
      <p>${textoEv}</p>
      <p><b>${resultadoTexto}</b></p>
      <div class="stat-linea"><span>Media actual</span><b>${jugador.media}</b></div>
      <button class="btn-principal" id="btn-jugar-partido">Jugar el partido de la semana</button>
    </div>
  `;
  document.getElementById("btn-jugar-partido").onclick = jugarPartidoDeLaSemana;
}

function continuarSinEvento(){
  screen.innerHTML = `
    <div class="card">
      <span class="eyebrow">Semana ${semana}/${TOTAL_SEMANAS} · Sin novedades</span>
      <h3>😌 Semana tranquila</h3>
      <p>Veniste de una gran nota en el partido anterior y esta semana no pasó nada especial.</p>
      <button class="btn-principal" id="btn-jugar-partido">Jugar el partido de la semana</button>
    </div>
  `;
  document.getElementById("btn-jugar-partido").onclick = jugarPartidoDeLaSemana;
}

/* ---------- PANTALLA 3: RESULTADO DEL PARTIDO ---------- */
function mostrarResultadoFinalPartido(resultado, g1, g2){
  gfPingu += g1; gcPingu += g2;
  gfWachines += g2; gcWachines += g1;

  let badge;
  if(resultado.miEquipo > resultado.rivalGoles){
    badge = `<span class="badge-resultado badge-gano">GANÓ TU EQUIPO</span>`;
    if(jugador.club === "Pingu FC") puntosPingu += 3; else puntosWachines += 3;
  } else if(resultado.miEquipo < resultado.rivalGoles){
    badge = `<span class="badge-resultado badge-perdio">PERDIÓ TU EQUIPO</span>`;
    if(jugador.club === "Pingu FC") puntosWachines += 3; else puntosPingu += 3;
  } else {
    badge = `<span class="badge-resultado badge-empato">EMPATE</span>`;
    puntosPingu += 1; puntosWachines += 1;
  }

  actualizarScoreboard();

  const cambioClase = resultado.cambioMedia > 0 ? "sube" : (resultado.cambioMedia < 0 ? "baja" : "");
  const cambioTexto = resultado.cambioMedia > 0 ? `+${resultado.cambioMedia}` : (resultado.cambioMedia < 0 ? `${resultado.cambioMedia}` : "sin cambios");

  const esUltima = semana === TOTAL_SEMANAS;

  const esArquero = jugador.posicion === "Arquero";
  const statsRendimiento = esArquero
    ? `<div class="stat-linea"><span>🧤 Atajadas</span><b>${resultado.atajadas}</b></div>`
    : `
      <div class="stat-linea"><span>⚽ Goles</span><b>${resultado.goles}</b></div>
      <div class="stat-linea"><span>🎯 Asistencias</span><b>${resultado.asistencias}</b></div>
    `;

  screen.innerHTML = `
    <div class="card">
      <span class="eyebrow">Semana ${semana}/${TOTAL_SEMANAS} · Partido</span>
      ${badge}
      <div class="marcador">
        <div class="equipo"><img src="pingu.png" alt="Pingu FC"><span>Pingu FC</span></div>
        <div class="goles">${g1} - ${g2}</div>
        <div class="equipo"><img src="wachin.jpeg" alt="Wachines FC"><span>Wachines FC</span></div>
      </div>
      <h2>Tu rendimiento</h2>
      ${statsRendimiento}
      <div class="stat-linea"><span>⭐ Nota</span><b>${resultado.nota}</b></div>
      ${resultado.nota >= 8.6 ? '<h2 style="color:black;">🏅 ¡Fuiste el MVP del partido! (+1 de media) </h2>' : ''}
      <div class="stat-linea"><span>Media</span><b class="media-cambio ${cambioClase}">${jugador.media} (${cambioTexto})</b></div>
      <button class="btn-principal" id="btn-siguiente">${esUltima ? "Ver resultados finales" : "Siguiente semana"}</button>
    </div>
  `;

  document.getElementById("btn-siguiente").onclick = avanzarSemana;
}

function avanzarSemana(){
  semana++;
  if(semana > TOTAL_SEMANAS){
    pantallaFinal();
  } else {
    iniciarSemana();
  }
}

/* ---------- PANTALLA 4: FINAL DE LA TEMPORADA ---------- */
function pantallaFinal(){
  scoreboardEl.classList.remove("visible");

  let campeon;
  if(puntosPingu > puntosWachines) campeon = "Pingu FC";
  else if(puntosWachines > puntosPingu) campeon = "Wachines FC";
  else campeon = "Empate";

  if(jugador.club === campeon) jugador.titulos += 1;

  const esArquero = jugador.posicion === "Arquero";

  let premio;
  if(jugador.mvp > 4) premio = "⭐ Mejor Jugador de la Pingu Cup";
  else if(esArquero && jugador.atajadas >= 18) premio = "🧤 Mejor Arquero de la Pingu Cup";
  else if(jugador.goles >= 6) premio = "🥇 Máximo Goleador";
  else if(jugador.asistencias >= 5) premio = "🎯 Máximo Asistente";
  else premio = "Sin premios individuales.";

  const statsFinales = esArquero
    ? `<div class="stat-linea"><span>Atajadas</span><b>${jugador.atajadas}</b></div>`
    : `
      <div class="stat-linea"><span>Goles</span><b>${jugador.goles}</b></div>
      <div class="stat-linea"><span>Asistencias</span><b>${jugador.asistencias}</b></div>
    `;

  const statsSeleccion = esArquero
    ? `<div class="stat-linea"><span>Atajadas</span><b>${jugador.selAtajadas}</b></div>`
    : `
      <div class="stat-linea"><span>Goles</span><b>${jugador.selGoles}</b></div>
      <div class="stat-linea"><span>Asistencias</span><b>${jugador.selAsistencias}</b></div>
    `;

  const bloqueSeleccion = jugador.selPartidos > 0 ? `
    <div class="card">
      <h2><img class="bandera-img chica" src="${urlBandera(jugador.paisCodigo)}"> Con la Selección de ${jugador.nacionalidad}</h2>
      <span class="eyebrow">Estadísticas con la selección</span>
      <div class="stat-linea"><span>Partidos</span><b>${jugador.selPartidos}</b></div>
      ${statsSeleccion}
      <div class="stat-linea"><span>Figura del partido</span><b>${jugador.selMVP}</b></div>
    </div>
  ` : "";

  screen.innerHTML = `
    <div class="card" style="text-align:center;">
      <span class="eyebrow">Final de la Pingu Cup</span>
      <h1>🏆 Campeón: ${campeon}</h1>
      <img src="trofeo.jpeg" width="220">
    </div>
    <div class="card">
      <h2><img class="bandera-img chica" src="${urlBandera(jugador.paisCodigo)}"> ${jugador.nombre} · ${jugador.nacionalidad}</h2>
      <span class="eyebrow">Tus estadísticas del torneo</span>
      <div class="stat-linea"><span>Partidos</span><b>${jugador.partidos}</b></div>
      ${statsFinales}
      <div class="stat-linea"><span>MVP</span><b>${jugador.mvp}</b></div>
      <div class="stat-linea"><span>Media final</span><b>${jugador.media}</b></div>
      <div class="stat-linea"><span>Títulos</span><b>${jugador.titulos}</b></div>
      <h2 style="margin-top:16px;">🏅 Premios</h2>
      <p>${premio}</p>
    </div>
    ${bloqueSeleccion}
    <div class="card">
      <button class="btn-principal" id="btn-de-nuevo">Jugar de nuevo</button>
    </div>
  `;

  document.getElementById("btn-de-nuevo").onclick = pantallaInicio;
}

/* =========================================================
   ARRANQUE
   ========================================================= */
pantallaInicio();
</script>
